services:
  docker-manager:
    image: ymzwh/docker-manager:latest
    container_name: docker-manager
    restart: always
    ports:
      - "13000:13000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_manager_data:/app/data
    environment:
      JWT_SECRET: CHANGE_ME_TO_RANDOM_STRING   # 必填：随机字符串
      ADMIN_USERNAME: admin                     # 必填：登录用户名
      ADMIN_PASSWORD: CHANGE_ME                 # 必填：登录密码
      TZ: Asia/Shanghai                         # 可选：时区

volumes:
  docker_manager_data:
